name: vodou
description: "VodooHost — plateforme de réservation d'hébergements culturels."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # UI Components
  smooth_page_indicator: ^1.1.0

  # Supabase Backend
  supabase_flutter: ^2.8.0

  # Stockage sécurisé des jetons de session — Keystore Android / Keychain iOS
  # (cf. AUDIT_SECURITE.md — VUL-10)
  flutter_secure_storage: ^9.2.2
  # Requis par SecureLocalStorage pour migrer les sessions héritées
  shared_preferences: ^2.3.2

  # Authentication (Social)
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1

  # Date & Time
  intl: ^0.19.0
  table_calendar: ^3.1.2

  # Paiement
  kkiapay_flutter_sdk: ^1.3.4

  # Utils
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  flutter_launcher_icons: ^0.14.4

  # ---------------------------------------------------------------------------
  # Dépendances retirées : déclarées mais jamais importées dans lib/
  # (cf. AUDIT_SECURITE.md — Q-11). Les réintroduire au moment de les utiliser.
  #
  #   flutter_svg            — aucun asset SVG dans le projet
  #   cached_network_image   — à RÉINTRODUIRE avec AppImage (phase 5.2 du plan)
  #   shimmer                — à RÉINTRODUIRE comme placeholder (phase 5.2)
  #   sign_in_with_apple     — connexion Apple désactivée dans SupabaseConfig
  #   intl_phone_field       — parcours OTP non implémenté
  #   country_picker         — idem
  #   dio                    — tous les appels passent par supabase_flutter
  #   hive / hive_flutter    — aucun cache local implémenté
  # ---------------------------------------------------------------------------

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation (pour Hive si nécessaire)
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  # Assets (à créer plus tard)
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo.png"
    
  # Polices Poppins (à ajouter plus tard)
  # Téléchargez les polices depuis https://fonts.google.com/specimen/Poppins
  # et placez-les dans assets/fonts/
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
