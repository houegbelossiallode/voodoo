name: vodou
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^14.2.7
  
  # UI Components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  
  # Supabase Backend
  supabase_flutter: ^2.8.0
  
  # Authentication (Social)
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1
  sign_in_with_apple: ^6.1.2
  
  # Phone Auth
  intl_phone_field: ^3.2.0
  country_picker: ^2.0.26
  
  # HTTP & API
  dio: ^5.7.0
  
  # Local Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Payment - Désactivé temporairement pour Windows
  # flutter_stripe: ^11.1.0
  
  # Maps & Location - Désactivé temporairement pour Windows
  # google_maps_flutter: ^2.9.0
  # geolocator: ^13.0.1
  # geocoding: ^3.0.0
  
  # Date & Time
  intl: ^0.19.0
  table_calendar: ^3.1.2
  
  # Utils
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  kkiapay_flutter_sdk: ^1.3.4
  flutter_launcher_icons: ^0.14.4
  # permission_handler: ^11.3.1  # Désactivé temporairement pour Windows
  
  # Notifications - Désactivé temporairement pour Windows
  # flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation (pour Hive si nécessaire)
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  # Assets (à créer plus tard)
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo.png"
    
  # Polices Poppins (à ajouter plus tard)
  # Téléchargez les polices depuis https://fonts.google.com/specimen/Poppins
  # et placez-les dans assets/fonts/
  # fonts:
  #   - family: Poppins
